<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace Atlas | OSINT Preview</title><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdn.tailwindcss.com"></script><script src="https://d3js.org/d3.v7.min.js"></script><style>body{margin:0;background:#080e1c}button,input,select{font:inherit}button:focus-visible{outline:2px solid cyan}@media print{.controls{display:none!important}section{break-inside:avoid}}</style></head><body><div id="root">Loading preview…</div><script type="text/babel">const {useState:S,useEffect:E,useRef:R}=React;const cats=['social','coding','photo','gaming','forum'],countries=['US','DE','JP','Global'],states=['found','not_found','blocked','error'];const color={found:'#34d399',not_found:'#64748b',blocked:'#fbbf24',error:'#fb7185',pending:'#334155'};function Graph({sites,user,select}){const ref=R();E(()=>{const svg=d3.select(ref.current);svg.selectAll('*').remove();const nodes=[{id:'root',name:user},...sites.filter(s=>s.status==='found').slice(0,14)],links=nodes.slice(1).map(n=>({source:'root',target:n.id}));const g=svg.append('g');svg.call(d3.zoom().scaleExtent([.3,4]).on('zoom',e=>g.attr('transform',e.transform)));const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(n=>n.id).distance(110)).force('charge',d3.forceManyBody().strength(-290)).force('center',d3.forceCenter(360,175));const line=g.selectAll('line').data(links).join('line').attr('stroke','#37516d');const node=g.selectAll('g').data(nodes).join('g').attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.name).on('click',(_,n)=>n.id!=='root'&&select(n)).on('keydown',(e,n)=>e.key==='Enter'&&n.id!=='root'&&select(n)).call(d3.drag().on('start',(e,n)=>{sim.alphaTarget(.3).restart();n.fx=n.x;n.fy=n.y}).on('drag',(e,n)=>{n.fx=e.x;n.fy=e.y}).on('end',(e,n)=>{sim.alphaTarget(0);n.fx=null;n.fy=null}));node.append('circle').attr('r',n=>n.id==='root'?23:13).attr('fill',n=>n.id==='root'?'#818cf8':'#22d3ee');node.append('text').text(n=>n.name).attr('y',33).attr('text-anchor','middle').attr('fill','#cbd5e1').attr('font-size',11);sim.on('tick',()=>{line.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',n=>`translate(${n.x},${n.y})`)});return()=>sim.stop()},[sites,user]);return <svg ref={ref} viewBox="0 0 720 350" className="w-full" aria-label="Illustrative account network"/>}function App(){const [user,U]=S('demo_user'),[cat,C]=S(''),[country,K]=S(''),[status,T]=S(''),[done,D]=S(0),[running,V]=S(false),[selected,Q]=S(null),[page,P]=S(0),[history,H]=S(()=>{try{return JSON.parse(localStorage.getItem('trace-atlas-history')||'[]')}catch{return []}});const all=React.useMemo(()=>Array.from({length:3200},(_,i)=>({id:'s'+i,name:'Demo site '+(i+1),category:cats[i%5],country:countries[Math.floor(i/5)%4],status:i<done?states[(i*17)%29<3?0:(i%11===0?2:i%19===0?3:1)]:'pending',tag:i%3===0?'Public bio':i%3===1?'Outbound link':'Username match',bio:'Synthetic profile metadata for interface testing only.'})),[done]);E(()=>{if(!running)return;const t=setInterval(()=>D(d=>Math.min(3200,d+80)),100);return()=>clearInterval(t)},[running]);E(()=>{if(done===3200)V(false)},[done]);E(()=>{P(0)},[cat,country,status]);E(()=>{const f=e=>e.key==='Escape'&&Q(null);window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f)},[]);const filtered=all.filter(s=>(!cat||s.category===cat)&&(!country||s.country===country)&&(!status||s.status===status)),found=all.filter(s=>s.status==='found').length;function save(){try{const h=[{user,done,found,time:new Date().toLocaleString()},...history].slice(0,20);localStorage.setItem('trace-atlas-history',JSON.stringify(h));H(h)}catch{alert('Local storage unavailable')}}const panel='rounded-2xl border border-slate-800 bg-slate-900/80 p-5';return <main className="min-h-screen text-slate-100 p-4 md:p-8 max-w-screen-2xl mx-auto space-y-5"><header className="flex justify-between flex-wrap gap-4"><div><p className="text-cyan-400 text-xs tracking-widest">IDENTITY DISCOVERY WORKSPACE</p><h1 className="text-3xl font-semibold mt-2">Trace Atlas</h1><p className="text-slate-400">OSINT dashboard · interactive preview</p></div><span className="text-amber-300">DEMO — synthetic results only</span></header><section className={panel+' controls flex flex-wrap gap-3'}><input aria-label="Demo username" maxLength="80" value={user} onChange={e=>U(e.target.value)} className="bg-slate-800 rounded-xl p-3 flex-1 min-w-0"/><button disabled={running||!user.trim()} onClick={()=>{D(0);V(true)}} className="bg-indigo-500 disabled:opacity-40 rounded-xl px-5 py-3">Simulate scan</button><button onClick={()=>V(!running)} disabled={!done||done===3200} className="px-3">{running?'Pause':'Resume'}</button><button onClick={save}>Save locally</button><button onClick={()=>window.print()}>Print</button></section><div className="grid grid-cols-2 lg:grid-cols-4 gap-4">{[['Checked',done],['Candidate accounts',found],['Blocked',all.filter(s=>s.status==='blocked').length],['Errors',all.filter(s=>s.status==='error').length]].map(([k,v])=><section key={k} className={panel}><p className="text-slate-400 text-sm">{k}</p><p className="text-3xl mt-2">{v.toLocaleString()}</p></section>)}</div><section className={panel+' flex flex-wrap gap-6 items-center'}><svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label={Math.round(done/32)+' percent complete'}><circle cx="52" cy="52" r="43" fill="none" stroke="#243247" strokeWidth="8"/><circle cx="52" cy="52" r="43" fill="none" stroke="#818cf8" strokeWidth="8" strokeDasharray="270.18" strokeDashoffset={270.18*(1-done/3200)} transform="rotate(-90 52 52)" style={{transition:'stroke-dashoffset .15s'}}/><text x="52" y="58" textAnchor="middle" fill="white">{Math.round(done/32)}%</text></svg><div><h2 className="text-lg">{running?'Simulating site checks':done===3200?'Simulation complete':'Ready to explore'}</h2><p className="text-slate-400">3,200 synthetic sites. No external profiles are searched.</p><p className="text-slate-400 text-sm">A matching username is not proof of identity. Country labels describe demo site tags, not a person's location.</p></div></section><div className="grid lg:grid-cols-3 gap-5"><section className={panel+' lg:col-span-2'}><h2 className="text-lg">Linked account network</h2><p className="text-xs text-slate-400">Illustrative links · drag nodes · scroll to zoom · click for details</p><Graph sites={all} user={user} select={Q}/></section><section className={panel}><h2>Account types</h2>{cats.map(c=>{const n=all.filter(s=>s.category===c&&s.status==='found').length;return <div key={c} className="mt-4 text-sm"><div className="flex justify-between"><span>{c}</span><span>{n}</span></div><div className="bg-slate-800 h-2 rounded mt-2"><div className="bg-cyan-400 h-2 rounded" style={{width:(found?n/found*100:0)+'%'}}/></div></div>})}<h3 className="mt-6">Review tags</h3><p className="text-slate-400 text-sm mt-2">Public bio · outbound link · username match. These are metadata indicators, not risk judgments about a person.</p></section></div><section className={panel}><div className="flex flex-wrap gap-3 controls mb-4">{[['Category',cat,C,cats],['Country',country,K,countries],['Status',status,T,[...states,'pending']]].map(([label,value,set,options])=><select key={label} aria-label={label} value={value} onChange={e=>set(e.target.value)} className="bg-slate-800 p-2 rounded-lg"><option value="">All {label.toLowerCase()}</option>{options.map(o=><option key={o}>{o}</option>)}</select>)}</div><h2 className="mb-4">Site status · {filtered.length.toLocaleString()} matches</h2><div className="flex flex-wrap gap-3 text-xs mb-4">{Object.entries(color).map(([s,c])=><span key={s} style={{color:c}}>● {s}</span>)}</div><div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2">{filtered.slice(page*64,page*64+64).map(s=><button key={s.id} onClick={()=>Q(s)} className="bg-slate-800 rounded-lg text-left p-3 text-xs"><span style={{color:color[s.status]}}>● {s.status}</span><p className="mt-2">{s.name}</p><p className="text-slate-400 mt-1">{s.category} · {s.country}</p></button>)}</div><div className="flex gap-4 mt-5 controls"><button disabled={!page} onClick={()=>P(page-1)}>Previous</button><span>{page+1} / {Math.max(1,Math.ceil(filtered.length/64))}</span><button disabled={(page+1)*64>=filtered.length} onClick={()=>P(page+1)}>Next</button></div></section><section className={panel}><h2>Local scan history</h2><p className="text-slate-400 text-sm">Summary snapshots stored only in this browser; not full result archives.</p>{history.map((h,i)=><p key={i} className="mt-3 text-sm">{h.user} · {h.done} checked · {h.found} candidates · {h.time}</p>)}</section>{selected&&<div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4" onClick={()=>Q(null)}><section role="dialog" aria-modal="true" aria-label="Synthetic profile dossier" className={panel+' max-w-lg w-full'} onClick={e=>e.stopPropagation()}><h2 className="text-xl">{selected.name}</h2><p className="text-amber-300 my-3">Synthetic profile dossier — not a real account</p><p>{selected.bio}</p><p className="mt-3">Status: {selected.status} · {selected.country} · {selected.category}</p><p className="mt-3">Review tag: {selected.tag}</p><button autoFocus onClick={()=>Q(null)} className="mt-5 bg-indigo-500 px-5 py-2 rounded-lg">Close</button></section></div>}</main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
