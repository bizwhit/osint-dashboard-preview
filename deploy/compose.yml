name: osint-gated
x-app: &app
  build: ../backend
  restart: unless-stopped
  environment: &env
    REDIS_URL: redis://redis:6379/0
    SPIDERFOOT_URL: http://spiderfoot:5001
    SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
    SUPABASE_KEY: ${SUPABASE_KEY:?Set SUPABASE_KEY}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD}
    CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
  networks: [private, egress]
  depends_on:
    redis:
      condition: service_healthy
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  spiderfoot:
    image: spiderfoot/spiderfoot:latest
    command: ['-l', '0.0.0.0:5001']
    restart: unless-stopped
    networks: [private, egress]
  backend:
    <<: *app
    command: [uvicorn, app.production:app, --host, '0.0.0.0', --port, '8000', --no-proxy-headers]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: [celery, '-A', app.tasks.celery_app, worker, '--loglevel=info', '--hostname=worker@%h', '--include=app.tasks.username,app.tasks.email,app.tasks.phone,app.tasks.domain']
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.tasks.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
        NEXT_PUBLIC_WS_BASE_URL: ${PUBLIC_WS_ORIGIN:?Set PUBLIC_WS_ORIGIN}
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    networks: [private]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, '-q', '-O', /dev/null, http://127.0.0.1/proxy-health]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  private:
    internal: true
  egress: {}
volumes:
  redis-data: {}
